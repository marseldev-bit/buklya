    <main class="cont">
        <!-- Добавление книги -->
        <form class="create">
            <h1 class="titleBrown">Добавление автора</h1>
            <div class="createFields">
                <div class="field">
                    <label>Имя автора:</label>
                    <input type="text" placeholder="Укажите имя...">
                </div>

                <div class="field">
                    <label>Биография:</label>
                    <textarea placeholder="Краткая биография автора......"></textarea>
                </div>

                <div class="doubleField">
                    <div class="field">
                        <label>Страна автора:</label>
                        <input type="number" placeholder="Укажите страну...">
                    </div>

                    <div class="field">
                        <label>Произведения:</label>
                        <input type="text" placeholder="Количество произведений...">
                    </div>
                </div>

                <div class="field">
                    <label>Годы жизни</label>
                    <div class="years">
                        <div class="year">
                            <p>С</p>
                            <input type="number" placeholder="Год рождения...">
                        </div>

                        <div class="year">
                            <p>по</p>
                            <input type="number" placeholder="Год ухода...">
                        </div>
                    </div>
                </div>

                <div class="field image">
                    <label>Обложка</label>
                    <div class="imageInput">
                        <label for="imageInput">Добавьте фото</label>
                        <p>Файл не выбран</p>
                    </div>
                    <input type="file" id="imageInput">
                </div>
            </div>

            <div class="createOptions">
                <button type="reset">Сбросить</button>
                <button type="submit">Создать</button>
            </div>
        </form>
